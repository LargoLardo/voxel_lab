run_name: tree_regeneration
dimensions: 3
model_kind: tree_family
conditional: true
environment_conditioning: true
resume: runs/tree_family/checkpoints/best.pt
seed: 42
device: auto
world_size: 16
batch_size: 4
materials: 4
hidden_channels: 8
model_width: 64
fire_rate: 0.5
iterations: 8000
rollout_steps: [24, 64]
# Keeps the retained CUDA autograd graph within a reliable 6 GB laptop-GPU budget.
# Long-horizon stability remains measured by the separate 512-step validation.
differentiable_step_limit: 96
pool_size: 128
fresh_fraction: 0.25
damage_probability: 0.5
damage_types: [sphere, cuboid, top]
damage_severities: [0.1, 0.25, 0.5]
damage_min_age: 64
learning_rate: 0.0003
gradient_clip: 1.0
state_limit: 4.0
loss_weights: {occupancy: 1.0, material: 0.2, leakage: 0.5, occupancy_range: 2.0, magnitude: 0.01, soft_dice: 1.0, soft_iou: 0.5, distance: 0.5, height: 0.25, width: 0.25, volume: 0.5, centroid: 0.25, branch_distribution: 0.25}
counterfactual_weight: 1.0
train_light_tropism: false
persistence_steps: [32, 96]
persistence_weight: 2.0
initial_genome_span: 1.0
genome_widen_fraction: 0.01
interpolation_start_fraction: 0.0
interpolation_fraction: 0.25
mutation_start_fraction: 0.0
mutation_fraction: 0.25
mutation_strength: 0.15
environment_start_fraction: 1.0
validation_steps: 512
validation_every: 250
validation_fire_seeds: [100142, 100143, 100144, 100145]
validation_random_count: 4
validation_interpolation_steps: 3
validation_mutation_count: 4
validation_mutation_strength: 0.15
validation_min_steps: 512
validation_recovery_steps: 128
validation_min_recovery_steps: 128
validation_aggregation: worst
archive_min_validation_steps: 512
archive_min_recovery_steps: 128
