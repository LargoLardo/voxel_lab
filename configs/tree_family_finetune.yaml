# Fine-tune a trained variation checkpoint with a fresh optimizer at lower LR.
# Select your strongest best.pt; architecture, tree scope and base reference are inherited.
# Start with the learned full gene range; isolated/interior examples remain mixed in.
run_name: tree_family_finetune
dimensions: 3
model_kind: tree_family
conditional: true
environment_conditioning: true
initialize_from_checkpoint: runs/tree_family/checkpoints/best.pt
# full: basics then variation; basics / variation / transition / gene_transition: only that part.
# variation and gene_transition follow the input checkpoint: one tree type for
# a specialist, all four for a family model. Architecture is inherited.
family_curriculum: variation
# Both transition modes grow the source before switching, retaining its voxel state.
transition_source_steps: 128
# Transition batches: 50% edits, 25% bases, 25% previously learned variation.
# Variation uses one base-only batch per four batches, in addition to neutral pairs.
# Variation and transitions protect the original base across checkpoint handoffs.
# Best checkpoints may lose at most .05 IoU/material accuracy or gain .05 drift
# per family/group. The legacy option name also applies to variation/full.
transition_retention_tolerance: 0.05
basic_family_fraction: 0.25
family_style_seeds: [0, 970806, 1941611, 2912417]
neutral_fraction: 0.25
combination_start_fraction: 0.0
# Among nonneutral pairs, retain isolated genes on familiar styles and mix
# intermediate values with full-range endpoint pairs throughout variation.
isolated_gene_fraction: 0.5
interior_gene_fraction: 0.5
seed: 42
device: auto
world_size: 16
batch_size: 8
materials: 4
hidden_channels: 8
model_width: 64
# Optional: hidden_layers: [32, 32] (must match the initialization checkpoint).
fire_rate: 0.5
iterations: 4000
rollout_steps: [24, 48]
pool_size: 0  # Auto: 16 for a specialist's genes, 64 for all families.
fresh_fraction: 0.25
learning_rate: 0.0001
gradient_clip: 1.0
state_limit: 4.0
loss_weights: {occupancy: 1.0, material: 0.2, leakage: 0.5, occupancy_range: 2.0, magnitude: 0.01, soft_dice: 1.0, soft_iou: 0.5, distance: 0.5, height: 0.25, width: 0.25, volume: 0.5, centroid: 0.25, trunk_dice: 0.25, branch_dice: 2.0, leaf_dice: 1.0}
minimum_branch_voxels: 8
minimum_leaf_voxels: 8
counterfactual_weight: 1.0
# One paired batch per update by default; opt into accumulation for larger
# effective batches at the cost of more training time per iteration.
gradient_accumulation: false
gradient_accumulation_steps: 1
train_light_tropism: false
persistence_steps: [16, 32]
persistence_weight: 1.0
initial_genome_span: 1.0
genome_widen_fraction: 0.45
# Keep this stage focused on genome separation. Environmental variation is
# introduced deliberately by tree_environment.yaml after regeneration.
environment_start_fraction: 1.0
validation_steps: 256
validation_every: 500
validation_fire_seeds: [100042, 100043]
validation_random_count: 2
validation_interpolation_steps: 2
validation_mutation_count: 2
validation_mutation_strength: 0.15
validation_min_steps: 256
validation_recovery_steps: 64
validation_min_recovery_steps: 64
validation_aggregation: worst
archive_min_validation_steps: 512
archive_min_recovery_steps: 128
