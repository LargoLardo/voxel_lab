run_name: tree_family
dimensions: 3
model_kind: tree_family
conditional: true
environment_conditioning: true
initialize_from_specialist: runs/tree_specialist/checkpoints/best.pt
specialist_context_channels: 0
seed: 42
device: auto
world_size: 16
batch_size: 8
materials: 4
hidden_channels: 8
model_width: 64
fire_rate: 0.5
iterations: 8000
rollout_steps: [24, 48]
pool_size: 64
fresh_fraction: 0.25
learning_rate: 0.0003
gradient_clip: 1.0
state_limit: 4.0
loss_weights: {occupancy: 1.0, material: 0.2, leakage: 0.5, occupancy_range: 2.0, magnitude: 0.01, soft_dice: 1.0, soft_iou: 0.5, distance: 0.5, height: 0.25, width: 0.25, volume: 0.5, centroid: 0.25, trunk_dice: 0.5, branch_dice: 1.0, leaf_dice: 1.0}
counterfactual_weight: 1.0
# Four paired microbatches are a practical 6 GB RTX 4050 compromise: effective
# batch 32 at the preset's 16³/batch-8 settings, or batch 8 at 32³/batch 2.
gradient_accumulation: true
gradient_accumulation_steps: 4
train_light_tropism: false
persistence_steps: [16, 32]
persistence_weight: 1.0
initial_genome_span: 0.15
genome_widen_fraction: 0.45
interpolation_start_fraction: 0.25
interpolation_fraction: 0.25
mutation_start_fraction: 0.45
mutation_fraction: 0.25
mutation_strength: 0.15
# Keep this stage focused on genome separation. Environmental variation is
# introduced deliberately by tree_environment.yaml after regeneration.
environment_start_fraction: 1.0
validation_steps: 256
validation_every: 500
validation_fire_seeds: [100042, 100043]
validation_random_count: 2
validation_interpolation_steps: 2
validation_mutation_count: 2
validation_mutation_strength: 0.15
validation_min_steps: 256
validation_recovery_steps: 64
validation_min_recovery_steps: 64
validation_aggregation: worst
archive_min_validation_steps: 512
archive_min_recovery_steps: 128
