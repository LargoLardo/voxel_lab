[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morphovoxel"
version = "0.1.0"
description = "Genome-conditioned neural cellular automata for growth and regeneration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "Pillow>=10",
  "imageio>=2.34",
  "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["morphovoxel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

